  <meta name="description" content="AVD Company olarak 25 yılı aşkın deneyimimizle ithalat, ihracat, danışmanlık ve lojistik alanlarında profesyonel hizmet sunuyoruz. Orta Doğu, Avrupa, Türkiye Cumhuriyetleri ve Rusya'da güçlü altyapımızla, firmaların uluslararası ticarette başarılı olmalarını sağlıyoruz. Şeffaf ve sonuç odaklı çözümlerimizle ticaret süreçlerinizi en düşük maliyetle yönetiyoruz." />
  <link rel="canonical" href="https://avdcompany.com/" />
  <link rel="alternate" hreflang="tr" href="https://avdcompany.com/tr/" />
  <link rel="alternate" hreflang="en" href="https://avdcompany.com/en/" />
  <link rel="alternate" hreflang="ar" href="https://avdcompany.com/ar/" />
  <link rel="alternate" hreflang="de" href="https://avdcompany.com/de/" />
  <link rel="alternate" hreflang="ru" href="https://avdcompany.com/ru/" />
  <link rel="alternate" hreflang="x-default" href="https://avdcompany.com/tr/" />
  <script>
(function() {
  var available = ["tr","en","ar","de","ru"];
  var fallbackLang = "en";
  var defaultLang = "tr";
  var settingDefaultLang = "";
  if (settingDefaultLang && available.indexOf(settingDefaultLang) !== -1) {
    location.replace('/' + settingDefaultLang + '/' + (location.search || '') + (location.hash || ''));
    return;
  }
  var browserLangs = [];
  if (navigator.languages && navigator.languages.length) {
    navigator.languages.forEach(function(l) {
      var code = (l.split('-')[0] || '').toLowerCase();
      if (code && browserLangs.indexOf(code) === -1) browserLangs.push(code);
    });
  }
  if (!browserLangs.length && navigator.language) {
    browserLangs.push((navigator.language.split('-')[0] || defaultLang).toLowerCase());
  }
  var chosen = null;
  for (var i = 0; i < browserLangs.length; i++) {
    if (available.indexOf(browserLangs[i]) !== -1) {
      chosen = browserLangs[i];
      break;
    }
  }
  if (chosen === null) {
    chosen = fallbackLang;
  }
  var target = '/' + chosen + '/' + (location.search || '') + (location.hash || '');
  location.replace(target);
})();
  </script>
</head>
<body>

</body>
